[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-signals-crawler"
description = "Copy-trading automatico: segnali da canale Telegram eseguiti direttamente su MetaTrader 5"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "telethon>=1.36",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    # Minor pinnata: le regole di DEFAULT di ruff cambiano tra le minor e la
    # CI installa sempre l'ultima, quindi senza limite la lint diventa rossa
    # da sola (è successo: PR #17). Le regole sono comunque dichiarate sotto.
    "ruff>=0.15,<0.16",
]

[project.scripts]
signals-crawler = "crawler.main:run"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["crawler"]

[tool.setuptools.dynamic]
version = { attr = "crawler.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

# Regole DICHIARATE, non ereditate dai default di ruff: i default cambiano
# tra le versioni e facevano fallire la CI su codice non toccato. Questo
# elenco è esattamente ciò che il progetto già rispetta.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",	# pycodestyle: import, statement, sintassi
    "F",				# pyflakes: import inutilizzati, nomi non definiti
    "I",				# isort: blocchi di import ordinati
    "UP",				# pyupgrade: costrutti obsoleti per py312
    "BLE",				# flake8-blind-except: except Exception non motivati
]
